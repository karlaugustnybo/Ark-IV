[project]
name = "ark-iv"
version = "0.1.0"
description = "Priority map for the EBP."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.2",
    "rich>=13.7.0",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "h3>=4.4.2",
    "psutil>=7.0",
    "geopandas>=1.0.0",
    "shapely>=2.0",
    "litestar>=2.18,<3",
    "granian>=2.5,<3",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.10,<3",
    "h3ronpy>=0.22,<0.23",
    "orjson>=3.10,<4",
    "pyogrio>=0.12,<1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]
edge = ["dated-complete-tree", "openpyxl>=3.1,<4"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Local experiments are not part of the supported code release.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.uv.sources]
dated-complete-tree = { git = "https://github.com/jdduke24/dated-complete-tree.git", rev = "a82c4ca2531e709f07265eef6f16ef971bf36d76" }

# Bound interactive serialization; notebooks pass lean chart frames, not full joins.
[tool.marimo.runtime]
output_max_bytes = 30_000_000
